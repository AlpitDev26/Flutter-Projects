<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Quiz TIC - Home Screen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="home-container">
        <div class="content">
            <img src="../images/tic_logo.png" alt="TIC Logo" class="logo">
            
            <div class="title-row">
                <p class="subtitle">TECH INNOVATION CLUB</p>
            </div>

            <div class="welcome-section">
                <div class="welcome-text">
                    <span class="greeting">HELLO 👋,</span>
                    <span class="welcome">WELCOME!</span>
                </div>
            </div>

            <div class="button-section">
                <button class="get-started-btn" onclick="navigateToLogin()">Get Started..</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
